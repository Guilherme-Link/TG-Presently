spring.application.name=presently

# Define o tempo de validade em segundos para os códigos de validação de evento
# Caso necessário, pode ser alterado injetando uma variável de ambiente
presently.validationcode.validfor=60

# Inclui mensagens nas respostas http de erro
spring.web.error.include-message=always   

# Configurações específicas para database
# URL, username e password devem ser definidas em variáveis de ambiente
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,classpath:webauthn-schema.sql
spring.jpa.properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto: update
spring.jpa.defer-datasource-initialization=true

server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore-dev.p12
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD:presently-dev}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=presently

presently.webauthn.rp-id=${WEBAUTHN_RP_ID:localhost}
presently.webauthn.allowed-origins=${WEBAUTHN_ALLOWED_ORIGINS:https://localhost:5173}
