spring.application.name=presently

# Define o tempo de validade em segundos para os códigos de validação de evento
# Caso necessário, pode ser alterado injetando uma variável de ambiente
presently.validationcode.validfor=60

# Inclui mensagens nas respostas http de erro
spring.web.error.include-message=always   

# Configurações específicas para database
# URL, username e password devem ser definidas em variáveis de ambiente
spring.datasource.url: jdbc:postgresql://localhost:5432/presently
spring.datasource.username: postgres
spring.datasource.password: 1234
spring.jpa.properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto: update
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=1234
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=presently
