spring.application.name=presently

# Define o tempo de validade em segundos para os códigos de validação de evento
# Caso necessário, pode ser alterado injetando uma variável de ambiente
presently.validationcode.validfor=60

# Precisão máxima (em metros) aceita pelo geofence; pode ser sobrescrita por variável de ambiente.
presently.geolocation.max-accuracy-meters=${PRESENTLY_GEOLOCATION_MAX_ACCURACY_METERS:100}

# Inclui mensagens nas respostas http de erro
spring.web.error.include-message=always   

# Configurações específicas para database
# URL, username e password devem ser definidas em variáveis de ambiente
spring.datasource.url=${SPRING_DATASOURCE_URL:${local.datasource.url}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${local.datasource.username}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${local.datasource.password}}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,classpath:webauthn-schema.sql
spring.jpa.properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto: update
spring.jpa.defer-datasource-initialization=true

server.port=${SERVER_PORT:${local.server.port}}
server.ssl.enabled=${SERVER_SSL_ENABLED:${local.server.ssl-enabled}}
server.ssl.key-store=${SERVER_SSL_KEY_STORE:${local.server.ssl-key-store}}
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD:${local.server.ssl-key-store-password}}
server.ssl.key-store-type=${SERVER_SSL_KEY_STORE_TYPE:${local.server.ssl-key-store-type}}
server.ssl.key-alias=${SERVER_SSL_KEY_ALIAS:${local.server.ssl-key-alias}}

presently.webauthn.rp-id=${WEBAUTHN_RP_ID:${local.webauthn.rp-id}}
presently.webauthn.allowed-origins=${WEBAUTHN_ALLOWED_ORIGINS:${local.webauthn.allowed-origins}}
