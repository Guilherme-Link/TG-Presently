spring.application.name=presently

# Configurações específicas para database
# URL, username e password devem ser definidas em variáveis de ambiente
spring.datasource.url: jdbc:postgresql://<servidor>:<porta>/<database>
spring.datasource.username: <meu-usuario>
spring.datasource.password: <minha-senha>
spring.jpa.properties.hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto: update